services:
  - type: web
    name: zalono-partner-app
    runtime: static
    branch: main
    rootDir: flutter_app
    buildCommand: sh render-build.sh
    staticPublishPath: build/web
  - type: web
    name: zalono-partner-backend
    runtime: node
    branch: main
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://zalona-partner-app-1.onrender.com
