name: zalono_partner
description: Zalono Salon Partner App for iOS and Android
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  image_picker: ^1.2.4
  file_picker: ^13.1.0
  image_picker_windows: ^0.2.2
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.2
  http: ^1.2.2
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: assets/app_icon.png
  adaptive_icon_background: "#F01938"
  adaptive_icon_foreground: assets/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans[wght].ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans[wght].ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans[wght].ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans[wght].ttf
          weight: 800
        - asset: assets/fonts/PlusJakartaSans[wght].ttf
          weight: 900
