services:
  - type: web
    name: zalono-partner-app
    runtime: static
    branch: main
    rootDir: flutter_app
    buildCommand: >-
      if ! command -v flutter >/dev/null 2>&1; then git clone --depth 1
      --branch stable https://github.com/flutter/flutter.git "$HOME/flutter";
      export PATH="$HOME/flutter/bin:$PATH"; fi; flutter config --enable-web;
      flutter pub get; flutter build web --release
    staticPublishPath: build/web
  - type: web
    name: zalono-partner-backend
    runtime: node
    branch: main
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://zalono-partner-app.onrender.com
